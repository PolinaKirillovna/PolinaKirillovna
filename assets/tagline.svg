<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" fill="none" role="img" aria-label="ML engineer with a .NET backend foundation">
  <defs>
    <linearGradient id="palette" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <style>
    text {
      opacity: 0;
      animation: cycle 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .l2 { animation-delay: -4s; }
    .l3 { animation-delay: -8s; }
    @keyframes cycle {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      33%  { opacity: 1; }
      43%  { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="url(#palette)">
    <text class="l1" x="450" y="30" opacity="0">ML engineer with a .NET backend foundation</text>
    <text class="l2" x="450" y="30" opacity="0">MSc in Deep Learning &amp; Generative AI @ ITMO</text>
    <text class="l3" x="450" y="30" opacity="0">LaTeX, dark coffee and the Three-Body Problem</text>
  </g>
</svg>
