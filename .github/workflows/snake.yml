name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237C3AED&color_dots=%23ede9fe,%23c4b5fd,%23a78bfa,%237c3aed,%23ec4899
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%23161b22,%237c3aed,%23a78bfa,%23ec4899,%2322d3ee

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
